name: Deploy to Hosting (Dedicated Subdomain FTP)

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & FTP Deploy to sahtak.dierhafer.site root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy via FTP (Dedicated FTP root folder)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: './'
          local-dir: ./dist/
