name: Build Admin Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-admin-apk:
    name: Build & Package Admin Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 required)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Capacitor for Admin App
        run: |
          node -e '
            const fs = require("fs");
            let config = fs.readFileSync("capacitor.config.ts", "utf8");
            config = config.replace("com.sahtak.dierhafer", "com.sahtak.dierhafer.admin");
            config = config.replace("صحتك دير حافر", "صحتك - إدارة النظام");
            fs.writeFileSync("capacitor.config.ts", config);
          '

      - name: Build Web Application (Admin Mode)
        run: |
          VITE_ADMIN_MODE=true npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Admin Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Admin APK Output
        run: |
          mkdir -p admin-apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk admin-apk-output/Sahtak-Admin.apk

      - name: Upload Admin APK as GitHub Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahtak-Admin-APK
          path: admin-apk-output/Sahtak-Admin.apk
          retention-days: 30

      - name: Publish Admin APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0-admin-apk
          name: "🛡️ تطبيق لوحة إدارة صحتك (Sahtak Admin APK)"
          body: |
            ### 🛡️ تطبيق لوحة الإدارة والتحكم - صحتك دير حافر (Package: com.sahtak.dierhafer.admin)
            
            ✅ هذه هي **نسخة APK المنفصلة الخاصة بالمدير / الإدارة**.
            - مثبتة بحزمة مستقلة (`com.sahtak.dierhafer.admin`) لتستطيع تثبيتها بجانب تطبيق المستخدمين العاديين.
            - مخصصة للتحكم الكامل، تعديل أوقات المناوبات، إدارة الصيدليات والمشافي، وإطلاق التحديثات الفورية.
          files: admin-apk-output/Sahtak-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
